[plugins]
androidApplication = { id = "com.android.application", version.ref = "application" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidLibrary = { id = "com.android.library", version.ref = "application" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
gms = { id = "com.google.gms.google-services", version.ref = "gms" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
performance = { id = "com.google.firebase.firebase-perf", version.ref = "performancePlugin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serializationPlugin" }

[bundles]
datastore = [
    "androidxDatastore",
    "androidxDatastoreCoreAndroid"
]

okhttp = [
    "okhttpLoggingInterceptor",
    "okhttp"
]

coroutines = [
    "coroutines",
    "coroutines-core"
]

coil3 = [
    "coil3",
    "coil3-network-okhttp"
]